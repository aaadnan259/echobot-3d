<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>EchoBot toy</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: grab; }
  .ball { position: absolute; inset: 3px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff 0 8%, #ffe680 9% 22%, #ff9b2e 55%, #d9560f 100%);
    box-shadow: 0 0 14px rgba(255, 170, 60, .7), inset -4px -6px 10px rgba(120, 40, 0, .35); }
  .ball::after { content: ""; position: absolute; inset: 18% 46% 18% 46%; border-radius: 4px; background: rgba(255, 255, 255, .55); transform: rotate(35deg); }
  .battery { position: absolute; left: 12px; right: 12px; top: 8px; bottom: 3px; border-radius: 6px; background: linear-gradient(90deg, #2fd17a, #9aff6b);
    box-shadow: 0 0 12px rgba(120, 255, 140, .8), inset 0 0 0 3px #1b6b3f; }
  .battery::before { content: ""; position: absolute; left: 30%; right: 30%; top: -6px; height: 6px; border-radius: 3px 3px 0 0; background: #1b6b3f; }
  .battery::after { content: "⚡"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; }
  .note { position: absolute; inset: 6px 8px 10px; background: #fff3a6; border-radius: 3px 3px 14px 3px; padding: 14px 12px 10px; box-sizing: border-box;
    box-shadow: 0 6px 14px rgba(70, 50, 0, .3); font: 600 14px/1.3 "Segoe Print", "Comic Sans MS", cursive; color: #5a3d00; transform: rotate(-3deg); cursor: pointer;
    animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  .note::before { content: ""; position: absolute; top: -6px; left: 40%; width: 34px; height: 14px; background: rgba(180, 140, 255, .7); transform: rotate(4deg); }
  .note small { display: block; margin-top: 6px; font: 11px "Segoe UI", sans-serif; color: #8a6d1f; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } }
</style>
</head>
<body>
<div id="t"></div>
<script>
const q = new URLSearchParams(location.search), kind = q.get("kind"), el = document.getElementById("t");
el.className = kind;
if (kind === "note") { el.textContent = q.get("text") || "Hi!"; const s = document.createElement("small"); s.textContent = "— EchoBot 💜 (click to remove)"; el.appendChild(s); }
let down = null;
addEventListener("mousedown", (e) => { if (e.button === 0) down = { x: e.screenX, y: e.screenY, drag: false }; });
addEventListener("mousemove", (e) => { if (down && !down.drag && Math.hypot(e.screenX - down.x, e.screenY - down.y) > 4) { down.drag = true; toy.dragStart(); } });
addEventListener("mouseup", () => { if (!down) return; if (down.drag) toy.dragEnd(); else toy.click(); down = null; });
addEventListener("blur", () => { if (down && down.drag) toy.dragEnd(); down = null; });
</script>
</body>
</html>
