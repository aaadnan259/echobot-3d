<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:">
<title>EchoBot</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #bubble { position: absolute; left: 5%; right: 5%; top: 1%; padding: 7px 10px; border-radius: 14px; background: #fff;
    color: #2a1660; font: 600 12px/1.3 "Segoe UI", system-ui, sans-serif; text-align: center; box-shadow: 0 2px 10px rgba(40, 10, 120, .3);
    opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; pointer-events: none; z-index: 5; }
  #bubble.show { opacity: 1; transform: none; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
  .p { position: absolute; font-size: 18px; will-change: transform, opacity; }
  .heart { animation: rise 1.6s ease-out forwards; }
  .note { animation: rise 2.2s ease-out forwards; color: #b48cff; font-weight: 700; }
  .zzz { animation: drift 2.6s ease-out forwards; color: #b8a6ff; font: 700 16px "Segoe UI", sans-serif; }
  .sweat { width: 7px; height: 10px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7cc7ff; animation: drip 1.1s ease-in forwards; }
  .conf { width: 6px; height: 9px; border-radius: 2px; animation: conf 1.8s cubic-bezier(.2,.6,.4,1) forwards; }
  .snow { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 4px #cfe4ff; animation: snow 4s linear forwards; }
  @keyframes rise { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -70px) scale(1.1); opacity: 0; } }
  @keyframes drift { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(28px, -50px) scale(1.2); opacity: 0; } }
  @keyframes drip { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .95; } 100% { transform: translate(0, 34px); opacity: 0; } }
  @keyframes conf { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }
  @keyframes snow { 0% { transform: translate(0, -10px); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx), 250px); opacity: 0; } }
</style>
</head>
<body>
<div id="fx"></div>
<div id="bubble"></div>
<script src="echobot-model.js"></script>
<script src="renderer.js"></script>
</body>
</html>
