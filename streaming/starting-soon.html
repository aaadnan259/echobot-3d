  :root { --bg-a: #f7f3ff; --bg-b: #b9a6f2; --ink: #2a1063; --sub: #5b3fb0; --chip: rgba(255,255,255,.7); }
  body.night { --bg-a: #2a2142; --bg-b: #0b0814; --ink: #f3edff; --sub: #b9a3ff; --chip: rgba(40,28,80,.7); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: radial-gradient(110% 100% at 30% 50%, var(--bg-a) 0%, var(--bg-b) 100%); color: var(--ink);
    font-family: "Fredoka", "Segoe UI", system-ui, sans-serif; }
  body.clear { background: transparent; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.clear #fx { display: none; }
  .layout { position: absolute; inset: 0; display: grid; grid-template-columns: 46% 54%; align-items: center; }
  #bot { position: relative; width: 100%; aspect-ratio: 1; }
  #bot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .words { display: flex; flex-direction: column; gap: 1.4vw; padding-right: 6vw; }
  #title { font-size: 7.4vw; font-weight: 700; line-height: 1; margin: 0; letter-spacing: -.01em;
    text-shadow: 0 .3vw 0 rgba(107, 31, 240, .18); animation: bob 3.2s ease-in-out infinite; }
  #sub { font-size: 2.3vw; font-weight: 500; color: var(--sub); margin: 0; }
  #clock { align-self: flex-start; font-size: 3.4vw; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--chip);
    padding: .5vw 1.8vw; border-radius: 99vw; margin-top: .8vw; }
  #zzz { position: absolute; left: 28%; top: 22%; font-size: 3.2vw; font-weight: 700; color: var(--sub); }
  #zzz span { position: absolute; opacity: 0; animation: z 3.6s ease-out infinite; }
  #zzz span:nth-child(2) { animation-delay: 1.2s; font-size: .8em; }
  #zzz span:nth-child(3) { animation-delay: 2.4s; font-size: 1.2em; }
  [hidden] { display: none !important; }
  @keyframes bob { 50% { transform: translateY(-.5vw); } }
  @keyframes z { 0% { opacity: 0; transform: translate(0, 0) rotate(-8deg); } 20% { opacity: 1; }
    100% { opacity: 0; transform: translate(4vw, -7vw) rotate(10deg); } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="layout">
  <div id="bot"></div>
  <div class="words">
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div id="clock"></div>
  </div>
</div>
<div id="zzz" hidden><span>z</span><span>z</span><span>Z</span></div>
<script src="echobot-model.js"></script>
<script src="scene.js"></script>
</body>
</html>
